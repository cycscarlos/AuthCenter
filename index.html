<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthCenter — Acceso</title>
  <meta name="description" content="Panel de administración del emisor central de licencias AuthCenter." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <h1>AuthCenter</h1>
        <p>Emisor central de licencias</p>
      </div>

      <p id="login-error" class="login-error" role="alert"></p>

      <form id="login-form" class="form-grid" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input
            id="email"
            class="input"
            type="email"
            autocomplete="email"
            placeholder="admin@ejemplo.com"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            id="password"
            class="input"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>

        <button id="btn-login" class="btn btn--primary" type="submit">
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
